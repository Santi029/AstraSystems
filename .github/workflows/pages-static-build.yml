# Preparation only: deliberately no Pages configuration, upload, or deployment.
name: Astra static build verification (not publication)
on:
  push:
    branches: ['verify/static-build-2026-11-17']
permissions:
  contents: read
concurrency:
  group: astra-static-verification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/verify/static-build-2026-11-17'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Check out selected revision without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked dependencies without package lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium for isolated browser tests
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Test and verify closed-gate static build
        run: sh static-hosting/ci-check.sh
      - name: Verify protected source files were not modified by the build
        run: git diff --exit-code -- index.html CNAME README.md LICENSE package-lock.json
